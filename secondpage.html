<!DOCTYPE html>
<html>
<head>
<title>Restaurant</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    background-color:#2d3436;
    margin:0;
    font-family:Arial, sans-serif;
}

/* Navigation Bar */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
}

.logo img{
    width:100px;
    border-radius:20%;
}

.navbar ul{
    list-style:none;
    display:flex;
    gap:20px;
    margin:0;
    padding:0;
}

.navbar ul li{
    border:1px solid white;
    padding:5px 15px;
}

.navbar ul li a{
    color:white;
    text-decoration:none;
}

.navbar ul li:hover{
    background-color:white;
}

.navbar ul li:hover a{
    color:black;
}

/* Main Banner */

.Dish{
    text-align:center;
    margin-top:20px;
}

.Dish img{
    width:90%;
    max-width:1200px;
    height:auto;
    border-radius:10px;
}

/* Image Gallery */

.gallery{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin:40px 20px;
}

.gallery img{
    width:250px;
    border-radius:10%;
}

/* Footer */

.footer{
    text-align:center;
    color:white;
    margin:30px;
}

.footer h4,
.footer h5,
.footer h3{
    margin:5px;
}

/* Mobile */

@media screen and (max-width:768px){

    .navbar{
        flex-direction:column;
    }

    .navbar ul{
        flex-direction:column;
        width:100%;
        text-align:center;
    }

    .gallery img{
        width:90%;
        max-width:300px;
    }

    .logo img{
        margin-bottom:15px;
    }
}

</style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        <img src="logo.jpeg" alt="Logo">
    </div>

    <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="#">SERVICES</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="menu.html">MENU</a></li>
        <li><a href="contact.html">CONTACT</a></li>
    </ul>

</div>

<div class="Dish">
    <img src="0.jpeg" alt="Main Dish">
</div>

<div class="gallery">
    <img src="0.8.jpg" alt="Dish 1">
    <img src="0.10.png" alt="Dish 2">
    <img src="0.11.jpg" alt="Dish 3">
</div>

<div class="footer">
    <h4>Create</h4>
    <h5>By</h5>
    <h3>Sahil & Team</h3>
</div>

</body>
</html>
