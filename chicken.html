<!DOCTYPE html>
<html>
<head>
<title>Chicken Starters</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    background-color:#2d3436;
    margin:0;
    font-family:Arial,sans-serif;
}

.logo img{
    height:100px;
    width:100px;
    margin:20px;
    border-radius:20%;
    box-shadow:1px 2px 2px 4px rgba(150,255,255,0.9);
}

.logo img:hover{
    box-shadow:1px 2px 2px 4px rgba(150,50,0,0.9);
}

h1{
    text-align:center;
    color:white;
    font-size:50px;
    text-shadow:2px 2px 4px rgba(150,255,255,0.9);
}

.container{
    width:95%;
    margin:auto;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.box{
    width:280px;
    background:white;
    border-radius:20px;
    box-shadow:1px 2px 4px 3px black;
    text-align:center;
    padding:10px;
}

.box img{
    width:180px;
    height:180px;
    border-radius:20px;
}

.box img:hover{
    width:185px;
    height:185px;
}

.box p{
    font-size:18px;
    font-weight:bold;
}

/* Mobile */

@media screen and (max-width:768px){

    h1{
        font-size:30px;
    }

    .box{
        width:90%;
    }

    .box img{
        width:150px;
        height:150px;
    }
}

</style>
</head>

<body>

<div class="logo">
    <a href="menu.html">
        <img src="logo.jpeg" alt="Logo">
    </a>
</div>

<h1>CHICKEN STARTERS</h1>
<hr>

<div class="container">

    <div class="box">
        <img src="1.jpg" alt="Fried Chicken">
        <p>Fried Chicken - $15</p>
    </div>

    <div class="box">
        <img src="2.webp" alt="Chicken Leg">
        <p>Chicken Leg - $18</p>
    </div>

    <div class="box">
        <img src="3.webp" alt="Chicken">
        <p>Chicken - $20</p>
    </div>

    <div class="box">
        <img src="4.jpg" alt="Full Chicken">
        <p>Full Chicken - $22</p>
    </div>

    <div class="box">
        <img src="5.jpg" alt="Chicken Leg">
        <p>Chicken Leg - $8</p>
    </div>

    <div class="box">
        <img src="6.jpg" alt="Butter Chicken">
        <p>Butter Chicken - $30</p>
    </div>

    <div class="box">
        <img src="7.jpg" alt="Chicken Breast">
        <p>Chicken Breast - $10</p>
    </div>

    <div class="box">
        <img src="8.jpg" alt="Chicken with Sauces">
        <p>Chicken with Sauces - $11</p>
    </div>

</div>

</body>
</html>
