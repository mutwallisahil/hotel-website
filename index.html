<!DOCTYPE html>
<html>
<head>
<title>MY HOTEL</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    background:url('hii.jpg') no-repeat center center fixed;
    background-size:cover;
    margin:0;
    font-family:Arial, sans-serif;
}

h1{
    text-align:center;
    color:white;
    font-size:40px;
    text-shadow:2px 2px 4px rgba(200,250,100,0.9);
}

h1:hover{
    color:#2c3e50;
}

ul{
    list-style:none;
    margin:0;
    padding:10px;
    display:flex;
    justify-content:center;
    gap:40px;
    border:1px solid black;
    position:relative;
}

ul li{
    position:relative;
    color:white;
    cursor:pointer;
    font-size:20px;
    text-shadow:2px 2px 4px rgba(100,250,100,0.9);
}

ul li:hover{
    color:black;
}

a{
    color:white;
    text-decoration:none;
}

a:hover{
    color:black;
}

/* Dropdown Menu */

.dropdown,
.dropdown2{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    background:#9980FA;
    min-width:200px;
    padding:0;
    border:1px solid black;
}

.dropdown li,
.dropdown2 li{
    display:block;
    padding:10px;
    margin:0;
}

li:hover .dropdown,
li:hover .dropdown2{
    display:block;
}

/* Mobile Responsive */

@media screen and (max-width:768px){

    h1{
        font-size:28px;
    }

    ul{
        flex-direction:column;
        align-items:center;
        gap:10px;
    }

    .dropdown,
    .dropdown2{
        position:static;
        width:100%;
    }
}

</style>
</head>

<body>

<h1>HOTEL PEACE</h1>

<ul>
    <li>
        Booking
        <ul class="dropdown">
            <li><a href="room.html">Rooms</a></li>
            <li>Meetings & Events Area</li>
            <li><a href="secondpage.html">Restaurants</a></li>
        </ul>
    </li>

    <li>Offers</li>

    <li>Amazing</li>

    <li>
        Us
        <ul class="dropdown2">
            <li>About</li>
            <li><a href="contact1.html">Contact Us</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="account.html">Create Account</a></li>
        </ul>
    </li>
</ul>

</body>
</html>
