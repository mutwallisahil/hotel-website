<!DOCTYPE html>
<html>
<head>
<title>Create Account</title>

<style>

body{
    background-color:#f7d794;
    font-family:Arial, sans-serif;
}

h1{
    text-align:center;
    font-size:40px;
}

.account{
    width:400px;
    margin:30px auto;
    padding:20px;
    background-color:white;
    border-radius:10px;
    box-shadow:2px 2px 10px gray;
}

.account label{
    display:block;
    margin-top:15px;
    cursor:pointer;
}

.account input{
    width:100%;
    padding:8px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    display:block;
    margin:20px auto;
    padding:10px 20px;
    cursor:pointer;
}

</style>
</head>

<body>

<h1>Create Account</h1>

<form>

<div class="account">

<label>
First Name:
<input type="text" name="firstname" required>
</label>

<label>
Middle Name:
<input type="text" name="middlename">
</label>

<label>
Last Name:
<input type="text" name="lastname" required>
</label>

<label>
Mobile:
<input type="tel" name="mobile" required>
</label>

<label>
E-mail:
<input type="email" name="email" required>
</label>

<label>
Password:
<input type="password" name="password" required>
</label>

</div>

<button type="submit">Submit</button>

</form>

</body>
</html>
