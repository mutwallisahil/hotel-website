<!DOCTYPE html>
<html>
<head>
<title>Registration</title>

<style>
body{
    background-color:#95afc0;
    font-family:Arial, sans-serif;
}

label{
    cursor:pointer;
}

.container{
    margin:40px auto;
    width:450px;
    background-color:#63cdda;
    box-shadow:2px 1px 10px 7px black;
    padding:20px;
    transition:width 2s, height 2s;
}

.container:hover{
    width:500px;
    background-color:#778beb;
    box-shadow:2px 1px 10px 7px #778beb;
}

h1{
    text-align:center;
}

input{
    margin-top:5px;
}

button{
    padding:8px 15px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>Room Registration</h1>

<form action="">

<label>
Name:
<input type="text" name="name" size="20" required>
</label>

<br><br>

<label>Gender:</label>

<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>

<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label>

<br><br>

<label for="checkin">Check-in:</label>
<input type="date" id="checkin" name="checkin" required>

<br><br>

<label for="checkintime">Check-in Time:</label>
<input type="time" id="checkintime" name="checkintime" required>

<br><br>

<label for="checkout">Check-out:</label>
<input type="date" id="checkout" name="checkout" required>

<br><br>

<label for="checkouttime">Check-out Time:</label>
<input type="time" id="checkouttime" name="checkouttime" required>

<br><br>

<label for="contact">Contact No:</label>
<input type="tel" id="contact" name="contact" required>

<br><br>

<label for="email">Email ID:</label>
<input type="email" id="email" name="email" required>

<br><br>

<label for="aadhar">Aadhar No:</label>
<input type="text" id="aadhar" name="aadhar" required>

<br><br>

<label>Room:</label>

<input type="radio" id="luxury" name="room" value="luxury">
<label for="luxury">Luxury</label>

<input type="radio" id="normal" name="room" value="normal">
<label for="normal">Normal</label>

<br><br>

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
